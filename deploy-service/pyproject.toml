[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-service"
version = "0.1.0"
description = "Metadata-driven service deployer for the HomeLab bootstrap repo"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
deploy-service = "deploy_service.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.mypy]
python_version = "3.10"
