---
# roles/etcd_backup/tasks/tools.yml
# etcd, etcdctl and etcdutl from the upstream release at the version kubeadm
# runs (image tag in the static pod manifest, e.g. registry.k8s.io/etcd:3.6.5-0),
# checksum-verified, versioned under {{ etcd_tools_dir }}. Only etcdctl and
# etcdutl go on the PATH; the etcd binary is used by the restore test alone.

- name: "etcd | Read the etcd image from the static pod manifest"
  ansible.builtin.slurp:
    src: /etc/kubernetes/manifests/etcd.yaml
  register: _etcd_manifest
  tags: [k8s, etcd_backup]

- name: "etcd | Work out the version and architecture"
  ansible.builtin.set_fact:
    etcd_version: >-
      {{ (_etcd_manifest.content | b64decode | from_yaml).spec.containers[0].image
         | regex_search(':v?([0-9]+\.[0-9]+\.[0-9]+)', '\1') | first }}
    _etcd_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  tags: [k8s, etcd_backup]

- name: "etcd | Create tools directory for v{{ etcd_version }}"
  ansible.builtin.file:
    path: "{{ etcd_tools_dir }}/v{{ etcd_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s, etcd_backup]

- name: "etcd | Download etcd v{{ etcd_version }}"
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-{{ _etcd_arch }}.tar.gz"
    checksum: "sha256:https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/SHA256SUMS"
    dest: "{{ etcd_tools_dir }}/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-{{ _etcd_arch }}.tar.gz"
    mode: "0644"
  tags: [k8s, etcd_backup]

- name: "etcd | Unpack etcd v{{ etcd_version }}"
  ansible.builtin.unarchive:
    src: "{{ etcd_tools_dir }}/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-{{ _etcd_arch }}.tar.gz"
    dest: "{{ etcd_tools_dir }}/v{{ etcd_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ etcd_tools_dir }}/v{{ etcd_version }}/etcdutl"
  tags: [k8s, etcd_backup]

- name: "etcd | Put etcdctl and etcdutl on the PATH"
  ansible.builtin.file:
    src: "{{ etcd_tools_dir }}/v{{ etcd_version }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: [etcdctl, etcdutl]
  tags: [k8s, etcd_backup]
