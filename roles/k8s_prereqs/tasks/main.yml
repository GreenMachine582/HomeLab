---
# roles/k8s_prereqs/tasks/main.yml
# Host settings every Kubernetes node needs before containerd and kubeadm.
# Swap stays on: kubelet runs with failSwapOn: false and swapBehavior NoSwap
# (see roles/kubeadm/templates/kubeadm-config.yaml.j2).

- name: "K8s prereqs | Load kernel modules at boot"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/k8s_prereqs)
      overlay
      br_netfilter
  tags: [k8s, prereqs]

- name: "K8s prereqs | Load kernel modules now"
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: [k8s, prereqs]

- name: "K8s prereqs | Kernel networking sysctls"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
  tags: [k8s, prereqs]

# Cilium's L7 and DNS proxies get redirected traffic, and the replies to
# their upstream connections, marked 0x200, which rule 9 routes via table
# 2004 ("local default"). Something on these nodes sets
# net.ipv4.conf.all.src_valid_mark=1 at runtime (no sysctl file does), so
# the kernel's source check follows that mark too, sees every source as
# local, and drops the packet (IP_LOCAL_SOURCE) unless accept_local=1 on
# the arrival interface. Turning accept_local on for eth0 would let the LAN
# spoof host addresses, so turn src_valid_mark off instead: nothing here
# relies on it (Tailscale's routes don't match on fwmark, rp_filter is
# off or loose). accept_local on the pod lxc* veths stays as a fallback for
# pod-to-pod proxying (Cilium's BPF already rejects spoofed pod sources);
# systemd-sysctl applies the glob to each new lxc interface via udev.
- name: "K8s prereqs | Sysctls for Cilium's L7 and DNS proxies"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-zzz-homelab-cilium-proxy.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/k8s_prereqs). See the task comment there.
      net.ipv4.conf.all.src_valid_mark = 0
      -net.ipv4.conf.lxc*.accept_local = 1
  tags: [k8s, prereqs]

- name: "K8s prereqs | Apply them now"
  ansible.builtin.shell: |
    f=/proc/sys/net/ipv4/conf/all/src_valid_mark
    if [ "$(cat "$f")" != 0 ]; then echo 0 > "$f"; echo "set $f=0"; fi
    for f in /proc/sys/net/ipv4/conf/lxc*/accept_local; do
      [ -e "$f" ] || continue
      if [ "$(cat "$f")" != 1 ]; then echo 1 > "$f"; echo "set $f=1"; fi
    done
  register: _proxy_sysctls
  changed_when: _proxy_sysctls.stdout | length > 0
  tags: [k8s, prereqs]

- name: "K8s prereqs | API endpoint name"
  ansible.builtin.include_tasks: hosts.yml
  tags: [k8s, prereqs]

# Raspberry Pi kernels ship with the memory cgroup controller off; kubelet
# needs it. /boot/firmware/cmdline.txt must stay a single line.
- name: "K8s prereqs | Check cgroup controllers"
  ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
  register: _cgroup_controllers
  changed_when: false
  check_mode: false
  tags: [k8s, prereqs, cgroups]

- name: "K8s prereqs | Enable the memory cgroup on Raspberry Pi"
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^((?!.*\bcgroup_enable=memory\b).*\S)\s*$'
    line: '\1 cgroup_enable=memory'
    backrefs: true
  register: _cmdline
  when:
    - "'memory' not in _cgroup_controllers.stdout.split()"
    - ansible_architecture == 'aarch64'
  tags: [k8s, prereqs, cgroups]

- name: "K8s prereqs | Reboot to apply the kernel command line"
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: _cmdline is changed
  tags: [k8s, prereqs, cgroups]

- name: "K8s prereqs | Assert the memory cgroup is available"
  ansible.builtin.command: cat /sys/fs/cgroup/cgroup.controllers
  register: _cgroup_controllers_after
  changed_when: false
  check_mode: false
  failed_when: "'memory' not in _cgroup_controllers_after.stdout.split()"
  tags: [k8s, prereqs, cgroups]
