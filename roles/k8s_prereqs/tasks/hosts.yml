---
# roles/k8s_prereqs/tasks/hosts.yml
# Shared by main.yml (nodes) and roles/k8s_client (the controller).

# Decision 23/29: the API is addressed by name, so a control-plane IP change
# is an Ansible re-run, not a cluster rebuild.
- name: "K8s prereqs | Resolve {{ k8s_api_name }} to the control plane"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ k8s_api_name }}$'
    line: "{{ k8s_control_plane_ip }} {{ k8s_api_name }}"
  tags: [k8s, prereqs]

# Raspberry Pi OS runs cloud-init with manage_etc_hosts: true, which rebuilds
# /etc/hosts from this template on every boot. Without the line here the Pi
# workers lose the API after a reboot and go NotReady (18 Oct 2026).
- name: "K8s prereqs | Find the cloud-init hosts template"
  ansible.builtin.stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: _cloud_hosts_tmpl
  tags: [k8s, prereqs]

- name: "K8s prereqs | Keep {{ k8s_api_name }} through cloud-init rewrites"
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: '\s{{ k8s_api_name }}$'
    line: "{{ k8s_control_plane_ip }} {{ k8s_api_name }}"
  when: _cloud_hosts_tmpl.stat.exists
  tags: [k8s, prereqs]
