---
# roles/k8s_prereqs/tasks/hosts.yml
# Shared by main.yml (nodes) and roles/k8s_client (the controller).

# Decision 23/29: the API is addressed by name, so a control-plane IP change
# is an Ansible re-run, not a cluster rebuild.
- name: "K8s prereqs | Resolve {{ k8s_api_name }} to the control plane"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ k8s_api_name }}$'
    line: "{{ k8s_control_plane_ip }} {{ k8s_api_name }}"
  tags: [k8s, prereqs]
