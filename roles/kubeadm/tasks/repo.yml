---
# roles/kubeadm/tasks/repo.yml
# pkgs.k8s.io apt repo for k8s_minor. Shared by packages.yml (nodes) and
# roles/k8s_client (the controller).
#
# Owns the source outright: one file, one line, one minor. Any other
# pkgs.k8s.io source (a manual install per the upstream docs, or an older
# minor) is removed, since apt refuses two entries for the same repo with
# different keys.

- name: "kubeadm | Ensure apt keyrings directory exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s, kubeadm]

- name: "kubeadm | Add Kubernetes v{{ k8s_minor }} apt signing key"
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.asc"
    owner: root
    group: root
    mode: "0644"
  tags: [k8s, kubeadm]

- name: "kubeadm | Find other pkgs.k8s.io sources"
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: ["*.list", "*.sources"]
    contains: '.*pkgs\.k8s\.io.*'
  register: _k8s_sources
  tags: [k8s, kubeadm]

- name: "kubeadm | Remove other pkgs.k8s.io sources"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _k8s_sources.files | rejectattr('path', 'equalto', '/etc/apt/sources.list.d/kubernetes.list') | list }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [k8s, kubeadm]

- name: "kubeadm | Remove the upstream docs' keyring"
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent
  tags: [k8s, kubeadm]

- name: "kubeadm | Kubernetes v{{ k8s_minor }} apt source"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/kubeadm/tasks/repo.yml). One minor at a time.
      deb [signed-by=/etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
  tags: [k8s, kubeadm]
