---
# roles/kubeadm/tasks/repo.yml
# pkgs.k8s.io apt repo for k8s_minor. Shared by packages.yml (nodes) and
# roles/k8s_client (the controller).

- name: "kubeadm | Ensure apt keyrings directory exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s, kubeadm]

- name: "kubeadm | Add Kubernetes v{{ k8s_minor }} apt signing key"
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.asc"
    owner: root
    group: root
    mode: "0644"
  tags: [k8s, kubeadm]

- name: "kubeadm | Add Kubernetes v{{ k8s_minor }} apt repository"
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-v{{ k8s_minor }}.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
    filename: kubernetes
    state: present
  tags: [k8s, kubeadm]
