---
# roles/kubeadm/tasks/join.yml (workers)
# Joins via k8s-api (from /etc/hosts) with a fresh token from the control
# plane. Skipped once the node has joined.

- name: "kubeadm | Check whether this node has joined"
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _kubelet_conf
  tags: [k8s, kubeadm, join]

- name: "kubeadm | Create a join command on the control plane"
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  register: _join_command
  delegate_to: "{{ groups['k8s_control_plane'][0] }}"
  changed_when: false
  no_log: true
  when: not _kubelet_conf.stat.exists
  tags: [k8s, kubeadm, join]

- name: "kubeadm | Join the cluster"
  ansible.builtin.command: "{{ _join_command.stdout }} --ignore-preflight-errors=Swap"
  no_log: true
  when: not _kubelet_conf.stat.exists
  tags: [k8s, kubeadm, join]
