---
# roles/cilium_install/vars/main.yml
# Helm values for a fresh install (and for upgrades before Flux owned the
# release). Kube-proxy replacement is on, so Cilium reaches the API server
# directly by IP. Since M3 homelab-cluster's
# infrastructure/controllers/cilium/helmrelease.yaml is the source of truth.
# These are the core networking values a rebuild needs before Flux runs;
# keep them the same as the HelmRelease. Values that need Flux-managed CRDs
# (gatewayAPI, l2announcements, M4) are deliberately left out: Flux adds
# them after a rebuild, and cilium_ansible_upgrade=true (--reset-values)
# drops them until Flux is resumed. cluster_status.yml prints the deployed
# values.
_cilium_settings:
  - kubeProxyReplacement=true
  - "k8sServiceHost={{ node_ip }}"
  - "k8sServicePort={{ k8s_api_port }}"
  - ipam.mode=kubernetes
  - operator.replicas=1
  # Restart the pods when cilium-config changes. Without these an upgrade
  # that only changes settings rewrites the ConfigMap but the running
  # agents keep the old values (the agent logs a config-drift warning).
  - rollOutCiliumPods=true
  - operator.rollOutPods=true
  - envoy.rollOutPods=true
  # Envoy's tcmalloc needs a 48-bit virtual address space; the Pi 4 kernel is
  # 39-bit and Envoy crash-loops there. Run it only on nodes labelled
  # supported (roles/k8s_node_config, host_vars cilium_l7_proxy).
  - envoy.nodeSelector.homelab/l7-proxy=supported

_cilium_set_args: "{{ _cilium_settings | map('regex_replace', '^', '--set=') | list }}"

# Recorded in a ConfigMap after each install/upgrade, so a settings change
# at the same version still triggers an upgrade.
_cilium_settings_record: "{{ ([cilium_version] + _cilium_settings) | join('\n') }}"
_cilium_settings_configmap: homelab-cilium-settings
