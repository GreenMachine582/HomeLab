---
# roles/cilium_install/vars/main.yml
# Helm values for install and upgrade. Kube-proxy replacement is on, so
# Cilium reaches the API server directly by IP. homelab-cluster's Cilium
# HelmRelease (M3/M4) must carry the same values.
_cilium_settings:
  - kubeProxyReplacement=true
  - "k8sServiceHost={{ node_ip }}"
  - "k8sServicePort={{ k8s_api_port }}"
  - ipam.mode=kubernetes
  - operator.replicas=1
  # Restart the pods when cilium-config changes. Without these an upgrade
  # that only changes settings rewrites the ConfigMap but the running
  # agents keep the old values (the agent logs a config-drift warning).
  - rollOutCiliumPods=true
  - operator.rollOutPods=true
  - envoy.rollOutPods=true
  # L7 and FQDN policy (and Gateway API) send traffic to Envoy or the DNS
  # proxy. On the Raspberry Pi OS kernel the iptables TPROXY rule matches
  # and Envoy's socket is transparent, yet the kernel drops the packet
  # before delivery, so those connections time out. eBPF TPROXY hands the
  # packet to the socket from Cilium's own programs instead. Beta in
  # Cilium; incompatible with the netkit datapath (we use veth).
  - bpf.tproxy=true

_cilium_set_args: "{{ _cilium_settings | map('regex_replace', '^', '--set=') | list }}"

# Recorded in a ConfigMap after each install/upgrade, so a settings change
# at the same version still triggers an upgrade.
_cilium_settings_record: "{{ ([cilium_version] + _cilium_settings) | join('\n') }}"
_cilium_settings_configmap: homelab-cilium-settings
