---
# roles/cilium_install/tasks/main.yml (control plane)
# Initial Cilium install with cilium-cli, as the Helm release "cilium" in
# kube-system so Flux can adopt it later (M3/M4). Kube-proxy replacement is
# on, so Cilium reaches the API server directly by IP: its agent containers
# don't see the node's /etc/hosts entry for k8s-api.

- name: "Cilium | Install cilium-cli"
  ansible.builtin.include_tasks: cli.yml
  tags: [k8s, cilium]

- name: "Cilium | Check for an existing install"
  ansible.builtin.command: kubectl -n kube-system get daemonset cilium
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _cilium_ds
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [k8s, cilium]

# One operator replica: with a single schedulable worker the default two
# (with anti-affinity) would leave one Pending forever. The same settings go
# to install and upgrade, so an upgrade can reset the release's values.
- name: "Cilium | Install Cilium {{ cilium_version }}"
  ansible.builtin.command:
    argv: "{{ ['cilium', 'install', '--version', cilium_version] + _cilium_set_args }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: _cilium_ds.rc != 0
  tags: [k8s, cilium]

# Existing installs: move to cilium_version with a Helm upgrade (so the
# release stays right for Flux to adopt). Downgrades work the same way.
# --reset-values, not --reuse-values: the stored values pin the old image
# tags, so reusing them changes the chart but not the running version.
- name: "Cilium | Read the running version"
  ansible.builtin.command: >-
    kubectl -n kube-system get daemonset cilium
    -o jsonpath={.spec.template.spec.containers[0].image}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _cilium_image
  changed_when: false
  check_mode: false
  when: _cilium_ds.rc == 0
  tags: [k8s, cilium]

- name: "Cilium | Change version to {{ cilium_version }}"
  when:
    - _cilium_ds.rc == 0
    - (':v' ~ cilium_version ~ '@') not in _cilium_image.stdout
  tags: [k8s, cilium]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  block:
    - name: "Cilium | Running image"
      ansible.builtin.debug:
        msg: "{{ _cilium_image.stdout }} → {{ cilium_version }}"

    - name: "Cilium | Upgrade to {{ cilium_version }}"
      ansible.builtin.command:
        argv: "{{ ['cilium', 'upgrade', '--version', cilium_version, '--reset-values'] + _cilium_set_args }}"

    - name: "Cilium | Wait for the agents"
      ansible.builtin.command: kubectl -n kube-system rollout status daemonset/cilium --timeout=10m
      changed_when: false

# --wait redraws its status every few seconds; only the last one matters.
- name: "Cilium | Wait until healthy"
  ansible.builtin.shell: |
    cilium status --wait --wait-duration 10m >/dev/null 2>&1
    rc=$?
    cilium status 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g'
    exit $rc
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _cilium_status
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [k8s, cilium]

- name: "Cilium | Status"
  ansible.builtin.debug:
    msg: "{{ _cilium_status.stdout_lines }}"
  tags: [k8s, cilium]

- name: "Cilium | Fail if unhealthy"
  ansible.builtin.fail:
    msg: "Cilium isn't healthy after 10 minutes; see the status above."
  when: _cilium_status.rc != 0
  tags: [k8s, cilium]
