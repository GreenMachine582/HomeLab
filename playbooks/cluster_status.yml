---
# playbooks/cluster_status.yml
#
# Read-only health report for the cluster and its nodes. Safe any time.
#
#   ansible-playbook playbooks/cluster_status.yml
#   ansible-playbook playbooks/cluster_status.yml -e connectivity_test=true
#
# Per node: addresses, routes to the other nodes, UFW status; warns when a
# node has more than one address on the LAN (it may send cluster traffic
# from one the others don't trust). From the control plane: nodes, Cilium
# nodes, pods, cilium status. connectivity_test=true also runs
# `cilium connectivity test` (it deploys test pods, then removes them).
# See docs/K8S_CLUSTER.md.

- name: "Probe | Discover each node's SSH endpoint"
  hosts: k8s
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: "Probe | Endpoint and identity (bootstrapped nodes only)"
      ansible.builtin.include_tasks:
        file: tasks/probe_ssh.yml
        # Always, so --tags runs still connect on the probed endpoint.
        apply:
          tags: [always]
      tags: [always]
      vars:
        probe_allow_fresh: false

- name: "Status | Node networking"
  hosts: k8s
  become: true
  gather_facts: true

  tasks:
    - name: "Status | Addresses on the LAN"
      ansible.builtin.shell: "ip -4 -o addr show to {{ lan_subnet }} | awk '{print $2\" \"$4}'"
      register: _lan
      changed_when: false

    - name: "Status | Collect LAN addresses"
      ansible.builtin.set_fact:
        _lan_addresses: "{{ _lan.stdout_lines }}"

    - name: "Status | Routes to the other nodes"
      ansible.builtin.command: "ip route get {{ hostvars[item].node_ip }}"
      loop: "{{ groups['k8s'] | difference([inventory_hostname]) }}"
      register: _routes
      changed_when: false

    - name: "Status | UFW"
      ansible.builtin.command: ufw status verbose
      register: _ufw
      changed_when: false

    - name: "Status | Report"
      ansible.builtin.debug:
        msg:
          node_ip: "{{ node_ip }}"
          interfaces: "{{ ansible_interfaces | sort }}"
          lan_addresses: "{{ _lan_addresses }}"
          routes: "{{ _routes.results | map(attribute='stdout') | list }}"
          ufw: "{{ _ufw.stdout_lines }}"

    - name: "Status | Warn about extra LAN addresses"
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} has {{ _lan_addresses | length }}
          addresses on {{ lan_subnet }} ({{ _lan_addresses | join(', ') }}).
          Traffic to other nodes may leave from one that isn't node_ip
          ({{ node_ip }}); check the routes above.
      when: _lan_addresses | length > 1

# laptop-01 runs closed at the site: lid ignored, never sleeps, battery
# capped, power monitor and Wake-on-LAN running, Wi-Fi off.
- name: "Status | Laptop power"
  hosts: k8s
  become: true
  gather_facts: false

  tasks:
    - name: "Status | Laptop power settings"
      when: laptop_power_enabled | default(false) | bool
      block:
        - name: "Status | Read lid, sleep, battery, services, Wake-on-LAN, Wi-Fi"
          ansible.builtin.shell: |
            warn() { echo "WARN: $*"; }
            logind="$(systemd-analyze cat-config systemd/logind.conf 2>/dev/null)"
            for k in HandleLidSwitch HandleLidSwitchExternalPower HandleLidSwitchDocked; do
                v="$(printf '%s\n' "$logind" | grep -E "^$k=" | tail -1 | cut -d= -f2)"
                echo "lid $k: ${v:-default}"
                [ "$v" = ignore ] || warn "$k is '${v:-default}', not ignore"
            done
            for t in sleep suspend hibernate hybrid-sleep; do
                s="$(systemctl is-enabled "$t.target" 2>/dev/null)"
                echo "target $t: $s"
                [ "$s" = masked ] || warn "$t.target is '$s', not masked"
            done
            for b in /sys/class/power_supply/BAT*; do
                [ -e "$b" ] || continue
                echo "battery ${b##*/}: $(cat "$b/capacity")% $(cat "$b/status"), limit $(cat "$b/charge_control_end_threshold" 2>/dev/null || echo none)"
            done
            for p in /sys/class/power_supply/*; do
                [ "$(cat "$p/type" 2>/dev/null)" = Mains ] && echo "ac online: $(cat "$p/online")"
            done
            units="homelab-power-monitor"
            {% if wol_mac | default('') | length > 0 %}
            units="$units homelab-wol"
            iface="$(ip route show default | awk '{print $5; exit}')"
            w="$(ethtool "$iface" 2>/dev/null | awk '$1 == "Wake-on:" {print $2}')"
            echo "wake-on-lan $iface: $w"
            [ "$w" = g ] || warn "Wake-on-LAN on $iface is '$w', not g"
            {% endif %}
            for u in $units; do
                s="$(systemctl is-active "$u")"
                echo "service $u: $s"
                [ "$s" = active ] || warn "$u is $s"
            done
            {% if node_disable_wifi | default(false) | bool %}
            wifi="$(rfkill list wifi 2>/dev/null | awk -F': ' '/Soft blocked/ {print $2}' | sort -u | tr '\n' ' ')"
            echo "wifi soft blocked: ${wifi:-no device}"
            case "$wifi" in *no*) warn "Wi-Fi isn't blocked";; esac
            {% endif %}
            true
          register: _laptop
          changed_when: false

        - name: "Status | Laptop report"
          ansible.builtin.debug:
            msg: "{{ _laptop.stdout_lines | reject('match', '^WARN: ') | list }}"

        - name: "Status | Laptop warnings"
          ansible.builtin.debug:
            msg: "WARNING: {{ _laptop.stdout_lines | select('match', '^WARN: ') | map('regex_replace', '^WARN: ', '') | join('; ') }}"
          when: "_laptop.stdout_lines | select('match', '^WARN: ') | list | length > 0"

- name: "Status | Cluster"
  hosts: k8s_control_plane
  become: true
  gather_facts: false

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: "Status | kubectl and cilium"
      ansible.builtin.command: "{{ item }}"
      loop:
        - kubectl get nodes -o wide
        - kubectl get ciliumnodes -o wide
        - kubectl get pods -A -o wide
        - cilium status
      register: _cluster
      changed_when: false
      failed_when: false

    - name: "Status | Report"
      ansible.builtin.debug:
        msg: "{{ _cluster.results | map(attribute='stdout_lines') | list }}"

    - name: "Status | Connectivity test"
      when: connectivity_test | default(false) | bool
      block:
        - name: "Status | Remove leftovers from earlier tests"
          ansible.builtin.shell: >-
            kubectl get ns -o name | grep '^namespace/cilium-test' |
            xargs -r kubectl delete --wait=true
          changed_when: false

        - name: "Status | cilium connectivity test"
          ansible.builtin.command: cilium connectivity test
          register: _conn
          changed_when: false
          failed_when: false

        - name: "Status | Connectivity test result"
          ansible.builtin.debug:
            msg: "{{ _conn.stdout_lines[-25:] + _conn.stderr_lines[-15:] }}"

        # Before the always: cleanup deletes the namespaces.
        - name: "Status | Why the test pods didn't start"
          ansible.builtin.shell: |
            for ns in $(kubectl get ns -o name | grep '^namespace/cilium-test' | cut -d/ -f2); do
              echo "== $ns"
              kubectl -n "$ns" get pods -o wide
              kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -20
            done
          register: _conn_diag
          changed_when: false
          when: _conn.rc != 0

        - name: "Status | Test pod diagnostics"
          ansible.builtin.debug:
            msg: "{{ _conn_diag.stdout_lines }}"
          when: _conn.rc != 0

        - name: "Status | Fail if the connectivity test failed"
          ansible.builtin.fail:
            msg: "cilium connectivity test failed (rc={{ _conn.rc }}); see the output above."
          when: _conn.rc != 0
      always:
        - name: "Status | Remove the test namespaces"
          ansible.builtin.shell: >-
            kubectl get ns -o name | grep '^namespace/cilium-test' |
            xargs -r kubectl delete --wait=false
          changed_when: false
