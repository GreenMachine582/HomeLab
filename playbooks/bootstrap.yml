---
# playbooks/bootstrap.yml
#
# Bootstraps Kubernetes nodes (inventories/k8s.yml) from WSL on the main PC.
# Replaces bootstrap_edge.yml/bootstrap_node.yml for the k8s design: no edge
# node, no Infisical. Secrets come straight from vault.yml.
#
#   ansible-playbook playbooks/bootstrap.yml --limit laptop-01
#
# Safe to re-run. A probe play decides per host:
#   hardened: the homelab key already works -> connect as homelab
#   fresh:    otherwise -> connect as bootstrap_user with a password, asked
#             for once (hidden) and also used for sudo
# On a fresh host the users role installs the admin and homelab keys,
# base_hardening turns password auth off, and the play switches to the
# homelab key for everything after that.
#
# Not yet: containerd, kubeadm, kernel/swap prerequisites (M2).
# See docs/K8S_BOOTSTRAP.md.

# ── Probe play ─────────────────────────────────────────────────────────────────
- name: "Probe | Pick a connection identity per node"
  hosts: k8s
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: "Probe | Assert the node's IP is set"
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - ansible_host | length > 0
          - ansible_host != 'EDIT_BEFORE_USE'
        fail_msg: >-
          No IP for {{ inventory_hostname }}. Set ip_{{ inventory_hostname | replace('-', '_') }}
          in inventories/group_vars/all/overrides.yml.

    # Also records the host key (accept-new), which Ansible needs before it
    # will log in with a password.
    - name: "Probe | Try the homelab key"
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=5
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - IdentitiesOnly=yes
          - -i
          - "{{ ansible_ssh_private_key_file | expanduser }}"
          - -p
          - "{{ ssh_port }}"
          - "homelab@{{ ansible_host }}"
          - "true"
      register: _probe_key
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Probe | Record result"
      ansible.builtin.set_fact:
        _hardened: "{{ _probe_key.rc == 0 }}"

    - name: "Probe | Show result"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }}):
          {{ 'hardened, connecting as homelab with the key'
             if _hardened else
             'fresh, connecting as ' ~ bootstrap_user ~ ' with a password' }}

    - name: "Probe | Ask for the bootstrap password"
      ansible.builtin.pause:
        prompt: >-
          Password for the install user on the fresh node(s)
          {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_hardened') | map(attribute='inventory_hostname') | join(', ') }}
        echo: false
      register: _bootstrap_pw
      run_once: true
      when: ansible_play_hosts | map('extract', hostvars) | rejectattr('_hardened') | list | length > 0

    - name: "Probe | Use the install user and password on fresh nodes"
      ansible.builtin.set_fact:
        ansible_user: "{{ bootstrap_user }}"
        ansible_password: "{{ _bootstrap_pw.user_input }}"
        ansible_become_password: "{{ _bootstrap_pw.user_input }}"
      no_log: true
      when: not _hardened

# ── Bootstrap play ─────────────────────────────────────────────────────────────
- name: "Bootstrap | Users, SSH hardening, Tailscale, firewall"
  hosts: k8s
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Meta | Confirm target"
      ansible.builtin.debug:
        msg: "Bootstrapping {{ inventory_hostname }} ({{ ansible_host }}) as {{ ansible_user }}"

    # Keep sudo resolving the new name, or every later command warns.
    - name: "System | Point 127.0.1.1 at the inventory hostname"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: "System | Set hostname"
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

  tasks:
    - name: "Roles | Users"
      ansible.builtin.include_role:
        name: users
      tags: [base, users]

    - name: "Roles | Base hardening"
      ansible.builtin.include_role:
        name: base_hardening
      tags: [base, hardening]

    # Fresh nodes only: password auth is now off, so switch to the homelab
    # key the users role just authorised. Trust the host key on ssh_port
    # first in case base_hardening moved sshd.
    - name: "Ansible | Trust host key on the hardened port"
      ansible.builtin.shell:
        cmd: "ssh-keyscan -p {{ ssh_port }} {{ ansible_host }} 2>/dev/null"
      register: _post_harden_host_keys
      changed_when: false
      delegate_to: localhost
      become: false
      when: not _hardened
      tags: [base, hardening]

    - name: "Ansible | Add host key to known_hosts"
      ansible.builtin.known_hosts:
        name: "{{ '[' ~ ansible_host ~ ']:' ~ ssh_port if ssh_port | int != 22 else ansible_host }}"
        key: "{{ item }}"
        state: present
      loop: "{{ _post_harden_host_keys.stdout_lines | default([]) | select('match', '^[^#]') | list }}"
      no_log: true
      delegate_to: localhost
      become: false
      when: not _hardened
      tags: [base, hardening]

    - name: "Ansible | Switch to the homelab key"
      ansible.builtin.set_fact:
        ansible_user: homelab
        ansible_ssh_private_key_file: ~/homelab/.ssh/homelab
        ansible_ssh_common_args: "-o PreferredAuthentications=publickey"
      when: not _hardened
      tags: [base, hardening]

    - name: "Ansible | Reconnect with the new identity"
      ansible.builtin.meta: reset_connection
      tags: [base, hardening]

    - name: "Roles | NVMe storage"
      ansible.builtin.include_role:
        name: nvme_storage
      when:
        - "'k8s_data' in group_names"
        - nvme_enabled | default(false)
      tags: [nvme, storage]

    - name: "Roles | Laptop power settings"
      ansible.builtin.include_role:
        name: laptop_power
      when: laptop_power_enabled | default(false)
      tags: [laptop, power]

    - name: "Roles | Tailscale"
      ansible.builtin.include_role:
        name: tailscale
      tags: [tailscale]

    - name: "Roles | Firewall"
      ansible.builtin.include_role:
        name: firewall
      vars:
        firewall_rules: "{{ ufw_rules }}"
      tags: [firewall]

  post_tasks:
    - name: "Notify | Discord, bootstrap complete"
      ansible.builtin.uri:
        url: "{{ notify_discord_webhook }}"
        method: POST
        body_format: json
        body:
          content: "✅ [Bootstrap] {{ inventory_hostname }} bootstrap.yml finished."
        status_code: 204
      become: false
      ignore_errors: true
      when: not ansible_check_mode
      tags: [always]
