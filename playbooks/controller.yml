---
# playbooks/controller.yml
#
# Sets up the Ansible controller: WSL on the main PC, the only machine that
# runs these playbooks and kubectl. Run once per controller, and again after
# bumping k8s_version, cilium_cli_version or flux_version. Needs your WSL
# sudo password:
#
#   ansible-playbook playbooks/controller.yml -K
#
# Installs: sshpass (first password-based bootstrap), the Ansible
# collections, kubectl, cilium-cli and flux at the cluster's versions, sops
# and age (homelab-cluster secrets), cloudflared (the tunnel), the k8s-api
# hosts entry, and KUBECONFIG=~/.kube/homelab.conf in ~/.bashrc.
# See docs/K8S_CLUSTER.md.
#
# Opt-in: --tags ssh_ca (break-glass SSH CA, docs/K8S_SITE.md) and
# --tags dev_wsl (tailscaled + key/TOTP sshd in WSL, docs/REMOTE_ACCESS.md).

- name: "Controller | Tooling for running the homelab"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  # localhost isn't in the k8s group, so take the cluster settings from the
  # control plane's view of group_vars/k8s.yml. Read each key through
  # hostvars[host][key], which renders it; a copy of hostvars[host] holds raw
  # templates that newer Ansible won't render (k8s-api once got the literal
  # "{{ ... }}" text).
  vars:
    _cp: "{{ groups['k8s_control_plane'][0] }}"
    k8s_version: "{{ hostvars[_cp]['k8s_version'] }}"
    k8s_minor: "{{ hostvars[_cp]['k8s_minor'] }}"
    k8s_api_name: "{{ hostvars[_cp]['k8s_api_name'] }}"
    # k8s-api from the controller: the LAN IP at home, laptop-01's Tailscale
    # IP once the cluster is remote (k8s_api_client_ip in overrides.yml).
    k8s_control_plane_ip: "{{ k8s_api_client_ip | default(hostvars[_cp]['node_ip']) }}"
    cilium_cli_version: "{{ hostvars[_cp]['cilium_cli_version'] }}"
    flux_version: "{{ hostvars[_cp]['flux_version'] }}"
    sops_version: "{{ hostvars[_cp]['sops_version'] }}"
    cloudflared_version: "{{ hostvars[_cp]['cloudflared_version'] }}"
    cloudflared_sha256: "{{ hostvars[_cp]['cloudflared_sha256'] }}"

  pre_tasks:
    - name: "Controller | Check the cluster settings rendered"
      ansible.builtin.assert:
        that:
          - k8s_control_plane_ip is match('^[0-9]+(\.[0-9]+){3}$')
          - k8s_minor is match('^[0-9]+\.[0-9]+$')
        fail_msg: >-
          k8s-api would map to '{{ k8s_control_plane_ip }}' (k8s_minor
          '{{ k8s_minor }}'). Set k8s_api_client_ip / ip_* in overrides.yml.
        quiet: true
      tags: [always]

    # At the remote site the LAN IP is only reachable through laptop-01's
    # subnet route; laptop-01's own Tailscale IP always works.
    - name: "Controller | Check k8s_api_client_ip is set for the remote site"
      ansible.builtin.assert:
        that:
          - k8s_api_client_ip is defined
          - k8s_api_client_ip is match('^100\.')
        fail_msg: >-
          node_network_static is on (cluster at the remote site), so set
          k8s_api_client_ip in overrides.yml to laptop-01's Tailscale IP
          (`tailscale ip -4 laptop-01`), not '{{ k8s_api_client_ip | default('unset') }}'.
        quiet: true
      when: node_network_static | default(false) | bool
      tags: [always]

  tasks:
    # First: a conflicting Kubernetes source (e.g. a manual kubectl install)
    # breaks every apt update, including the next task's.
    - name: "Controller | Kubernetes apt repository"
      ansible.builtin.include_role:
        name: kubeadm
        tasks_from: repo
      tags: [controller, client, kubectl]

    - name: "Controller | Base packages"
      ansible.builtin.apt:
        name:
          - sshpass
          - gpg
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [controller, packages]

    - name: "Controller | Ansible collections"
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml
        chdir: "{{ playbook_dir }}/.."
      register: _galaxy
      changed_when: "'was installed successfully' in _galaxy.stdout"
      become: false
      tags: [controller, collections]

    - name: "Controller | kubectl, cilium-cli, flux, sops, cloudflared, k8s-api, KUBECONFIG"
      ansible.builtin.include_role:
        name: k8s_client
      tags: [controller, client, cloudflared]

    # Warn only: on a first run there's no cluster yet.
    - name: "Controller | Check the API is reachable"
      ansible.builtin.command:
        argv: [timeout, "5", bash, -c, "</dev/tcp/{{ k8s_control_plane_ip }}/{{ k8s_api_port | default(6443) }}"]
      register: _api_reach
      changed_when: false
      failed_when: false
      become: false
      tags: [controller, client]

    - name: "Controller | API reachability"
      ansible.builtin.debug:
        msg: >-
          {{ 'k8s-api (' ~ k8s_control_plane_ip ~ ') answers.' if _api_reach.rc == 0 else
             'WARNING: k8s-api (' ~ k8s_control_plane_ip ~ ') does not answer. Is the cluster up, and is that address reachable from here?' }}
      tags: [controller, client]

    # Break-glass SSH user CA (docs/K8S_SITE.md). Only with --tags ssh_ca.
    # The private key stays here; bootstrap.yml installs the public half on
    # the nodes; scripts/sign-breakglass.sh signs one-hour certificates.
    - name: "Controller | Break-glass SSH user CA"
      tags: [never, ssh_ca]
      become: false
      vars:
        _ca_key: "{{ playbook_dir }}/../.ssh/homelab-user-ca"
      block:
        - name: "Controller | Check for an existing CA"
          ansible.builtin.stat:
            path: "{{ _ca_key }}"
          register: _ca

        - name: "Controller | Passphrase for the new CA key"
          ansible.builtin.pause:
            prompt: "Passphrase for the break-glass CA key (store it in your password manager)"
            echo: false
          register: _ca_pass
          when: not _ca.stat.exists

        - name: "Controller | Create the CA key pair"
          ansible.builtin.command:
            argv: [ssh-keygen, -t, ed25519, -f, "{{ _ca_key }}", -C, homelab-user-ca, -N, "{{ _ca_pass.user_input }}"]
            creates: "{{ _ca_key }}"
          no_log: true
          when: not _ca.stat.exists

        - name: "Controller | Next step"
          ansible.builtin.debug:
            msg: >-
              CA at {{ _ca_key }}(.pub). Back up the private key offline with the
              age key. Run bootstrap.yml to install the public key on the nodes.

    # SSH from your laptop into WSL (docs/REMOTE_ACCESS.md). Only with
    # --tags dev_wsl. tailscaled puts WSL on the tailnet, where the policy
    # lets only your devices reach port 22; sshd then wants a key and a TOTP
    # code on every login. You run `tailscale up` and the TOTP enrolment
    # yourself, so no pre-approved auth key or TOTP secret goes near Ansible.
    - name: "Controller | SSH into WSL from your laptop"
      tags: [never, dev_wsl]
      when: "'microsoft' in ansible_kernel | lower"
      block:
        - name: "Controller | Boot WSL with systemd (tailscaled needs it)"
          community.general.ini_file:
            path: /etc/wsl.conf
            section: boot
            option: systemd
            value: "true"
            owner: root
            group: root
            mode: "0644"

        - name: "Controller | Check systemd is running"
          ansible.builtin.assert:
            that: ansible_service_mgr == 'systemd'
            fail_msg: >-
              systemd isn't PID 1 yet. From Windows run `wsl --shutdown`,
              reopen WSL, then re-run with --tags dev_wsl.
            quiet: true

        - name: "Controller | Install and start tailscaled"
          ansible.builtin.include_role:
            name: tailscale
            apply:
              tags: [dev_wsl]
          vars:
            tailscale_up: false
            tailscale_repo_distro: "{{ ansible_distribution | lower }}"

        - name: "Controller | OpenSSH server and the TOTP PAM module"
          ansible.builtin.apt:
            name:
              - openssh-server
              - libpam-google-authenticator
            state: present
            update_cache: true
            cache_valid_time: 3600

        # "00-" so it beats any other drop-in: sshd takes the first value of
        # each keyword. Both methods are required, in this order.
        - name: "Controller | sshd: key, then TOTP, for dev_wsl_user only"
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/00-dev-wsl.conf
            content: |
              # Managed by playbooks/controller.yml --tags dev_wsl
              PermitRootLogin no
              PasswordAuthentication no
              KbdInteractiveAuthentication yes
              UsePAM yes
              AuthenticationMethods publickey,keyboard-interactive
              AllowUsers {{ dev_wsl_user }}
              MaxAuthTries 3
              X11Forwarding no
            owner: root
            group: root
            mode: "0600"
            validate: "sshd -t -f %s"
          register: _wsl_sshd

        # sshd's PAM stack asks for the TOTP code instead of the password;
        # the key already stands in for "something you have". No nullok, so
        # a user who hasn't enrolled can't log in at all.
        - name: "Controller | PAM: no password prompt over SSH"
          ansible.builtin.lineinfile:
            path: /etc/pam.d/sshd
            regexp: '^#?\s*@include common-auth'
            line: "# @include common-auth  # key + TOTP instead (controller.yml --tags dev_wsl)"
            backup: true
          register: _wsl_pam_auth

        - name: "Controller | PAM: ask for the TOTP code"
          ansible.builtin.lineinfile:
            path: /etc/pam.d/sshd
            line: "auth required pam_google_authenticator.so"
            insertafter: '^# @include common-auth'
          register: _wsl_pam_totp

        # Ubuntu 24.04 socket-activates sshd, and ssh.service then can't bind
        # 22. Run it as a plain service on every release instead.
        # check mode: the units don't exist until openssh-server is installed.
        - name: "Controller | sshd without socket activation"
          ansible.builtin.systemd:
            name: ssh.socket
            enabled: false
            state: stopped
          ignore_errors: "{{ ansible_check_mode }}"

        - name: "Controller | Enable and (re)start sshd"
          ansible.builtin.systemd:
            name: ssh
            enabled: true
            state: "{{ 'restarted' if (_wsl_sshd.changed or _wsl_pam_auth.changed or _wsl_pam_totp.changed) else 'started' }}"
          ignore_errors: "{{ ansible_check_mode }}"

        - name: "Controller | Look up dev_wsl_user"
          ansible.builtin.getent:
            database: passwd
            key: "{{ dev_wsl_user }}"

        - name: "Controller | Check the key and TOTP enrolment"
          ansible.builtin.stat:
            path: "{{ getent_passwd[dev_wsl_user][4] }}/{{ item }}"
          loop: [.ssh/authorized_keys, .google_authenticator]
          register: _wsl_auth_files

        - name: "Controller | Check whether WSL is on the tailnet"
          ansible.builtin.command: tailscale status --json
          register: _wsl_ts
          changed_when: false
          failed_when: false
          check_mode: false

        - name: "Controller | Next steps"
          ansible.builtin.debug:
            msg: "{{ _steps | select | list or ['All set: ssh ' ~ dev_wsl_user ~ '@dev-wsl from your laptop.'] }}"
          vars:
            _on_tailnet: "{{ _wsl_ts.rc == 0 and (_wsl_ts.stdout | from_json).BackendState | default('') == 'Running' }}"
            _steps:
              - "{{ '' if _on_tailnet else 'Run: sudo tailscale up --hostname=dev-wsl --advertise-tags=tag:dev-wsl --accept-dns=false, then approve dev-wsl in the admin console.' }}"
              - "{{ '' if _wsl_auth_files.results[0].stat.exists else 'Add the laptop public key to ~/.ssh/authorized_keys.' }}"
              - "{{ '' if _wsl_auth_files.results[1].stat.exists else 'Enrol TOTP as ' ~ dev_wsl_user ~ ': google-authenticator -t -d -f -r 3 -R 30 -w 3' }}"
