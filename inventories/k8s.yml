---
# inventories/k8s.yml
# Kubernetes cluster nodes. Run from WSL on the main PC, the only Ansible
# controller (see docs/K8S_BOOTSTRAP.md). Hand-written; replaces prod.yml and
# topology.yml, which stay for the legacy stack until the M8 cutover.
#
# IPs live in the gitignored group_vars/all/overrides.yml (ip_laptop_01,
# ip_rpi_03, ...) and are pinned by router DHCP reservations.
#
# Group names are k8s_* on purpose: the legacy group_vars/data.yml
# (Postgres/Redis firewall rules) must never apply to these hosts.

all:
  vars:
    ansible_user: homelab
    ansible_ssh_private_key_file: ~/homelab/.ssh/homelab
    ansible_python_interpreter: /usr/bin/python3
    ansible_port: "{{ ssh_port }}"

  children:
    k8s:
      children:
        k8s_control_plane:
          hosts:
            laptop-01:
              ansible_host: "{{ ip_laptop_01 }}"

        k8s_workers:
          hosts:
            rpi-03:
              ansible_host: "{{ ip_rpi_03 }}"
            # rpi-01:
            #   ansible_host: "{{ ip_rpi_01 }}"
            # rpi-02:
            #   ansible_host: "{{ ip_rpi_02 }}"

        # Database node: tainted in M2, local PVs on its NVMe.
        k8s_data:
          hosts:
            rpi-03:
