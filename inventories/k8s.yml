---
# inventories/k8s.yml
# Kubernetes cluster nodes. Run from WSL on the main PC, the only Ansible
# controller (see docs/K8S_BOOTSTRAP.md). Hand-written; replaces prod.yml and
# topology.yml, which stay for the legacy stack until the M8 cutover.
#
# node_ip is the LAN address Kubernetes uses (kubelet --node-ip, etcd,
# k8s-api). IPs live in the gitignored group_vars/all/overrides.yml (ip_laptop_01,
# ip_rpi_03, ...); pin them with router DHCP reservations (deferred for now).
#
# Group names are k8s_* on purpose: the legacy group_vars/data.yml
# (Postgres/Redis firewall rules) must never apply to these hosts.

all:
  vars:
    ansible_user: homelab
    ansible_ssh_private_key_file: ~/homelab/.ssh/homelab
    ansible_python_interpreter: /usr/bin/python3
    ansible_port: "{{ ssh_port }}"
    # The probe (playbooks/tasks/probe_ssh.yml) may swap in a Tailscale name.
    ansible_host: "{{ node_ip }}"

  children:
    k8s:
      children:
        k8s_control_plane:
          hosts:
            laptop-01:
              node_ip: "{{ ip_laptop_01 }}"

        k8s_workers:
          hosts:
            rpi-03:
              node_ip: "{{ ip_rpi_03 }}"
            # rpi-01:
            #   node_ip: "{{ ip_rpi_01 }}"
            #   argon_case: v2
            # rpi-02:
            #   node_ip: "{{ ip_rpi_02 }}"
            #   argon_case: v2

        # Database node: local PVs on its NVMe. Labelled in M2; the database
        # taint waits for general workers (k8s_data_taint_enabled).
        k8s_data:
          hosts:
            rpi-03:
