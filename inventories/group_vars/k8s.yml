---
# inventories/group_vars/k8s.yml
# Applied to every Kubernetes node (inventories/k8s.yml). Overrides the
# legacy defaults in group_vars/all/main.yml where the k8s design differs.

# ── Bootstrap ─────────────────────────────────────────────────────────────────
# User created at OS install, used only for the first (password) login.
# Override per host in host_vars/<node>.yml if it differs.
bootstrap_user: admin

# ── Users ─────────────────────────────────────────────────────────────────────
# No deploy user (the webhook deploy gate is retired) and no docker group.
homelab_users:
  - name: admin
    groups: sudo
    shell: /bin/bash
    ssh_key: "{{ vault_admin_ssh_pubkey }}"
    sudo_passwordless: false

  - name: homelab
    groups: ""
    shell: /bin/bash
    ssh_key: "{{ vault_homelab_ssh_pubkey }}"
    sudo_passwordless: true

# ── Break-glass SSH (docs/K8S_SITE_MOVE.md) ────────────────────────────────────
# Public half of the user CA made by `controller.yml --tags ssh_ca`; empty
# (feature off) until that key exists in the repo's .ssh/ folder.
ssh_user_ca_pubkey: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../.ssh/homelab-user-ca.pub', errors='ignore') | default('', true) }}"

# ── Notifications ─────────────────────────────────────────────────────────────
# ntfy lived on homelab-observe, which is gone. Discord only for now.
notify_ntfy_url: ""

# ── Tailscale ─────────────────────────────────────────────────────────────────
# Nodes keep their own DNS (roles/node_network lan_dns); MagicDNS is only
# needed on the controller.
tailscale_accept_dns: false

# ── Wake-on-LAN (roles/wake_on_lan) ───────────────────────────────────────────
# The Pis boot by themselves when power returns (Argon "always on") and wake
# the nodes that can't (wol_mac in host_vars). The first worker posts the result.
wol_waker: "{{ inventory_hostname in groups['k8s_workers'] }}"
wol_report: "{{ inventory_hostname == groups['k8s_workers'] | first }}"

# ── Kubernetes (playbooks/cluster.yml) ─────────────────────────────────────────
# 1.36 is the newest minor in Cilium 1.20's tested matrix (decision 27).
# Packages are held; upgrading is a deliberate PR that bumps these.
k8s_version: "1.36.5"
k8s_minor: "{{ k8s_version.split('.')[:2] | join('.') }}"
k8s_api_name: k8s-api
k8s_api_port: 6443
k8s_pod_cidr: 10.244.0.0/16
k8s_service_cidr: 10.96.0.0/12
k8s_control_plane_ip: "{{ hostvars[groups['k8s_control_plane'][0]].node_ip }}"

cilium_version: "1.20.2"
cilium_cli_version: "v0.20.1"

# Database taint on k8s_data nodes. Off until rpi-01/02 join as general
# workers; with it on now, general pods would have nowhere to run.
k8s_data_taint_enabled: false

# ── Firewall ──────────────────────────────────────────────────────────────────
# The firewall role always allows ssh_port as well.
ufw_rules:
  - { port: "{{ ssh_port }}", proto: tcp, src: "{{ lan_subnet }}", comment: "SSH (LAN)" }
  - { port: "{{ ssh_port }}", proto: tcp, src: "{{ tailscale_cgnat_range }}", comment: "SSH (tailnet)" }
  - { port: "{{ k8s_api_port }}", proto: tcp, src: "{{ lan_subnet }}", comment: "Kubernetes API (LAN)" }
  - { port: "{{ k8s_api_port }}", proto: tcp, src: "{{ tailscale_cgnat_range }}", comment: "Kubernetes API (tailnet)" }
  # Cilium node-to-node ports, from the whole LAN: a node may send from a
  # second LAN address (e.g. laptop Wi-Fi) that isn't its node_ip.
  # https://docs.cilium.io/en/stable/operations/system_requirements/#firewall-rules
  - { port: 8472, proto: udp, src: "{{ lan_subnet }}", comment: "Cilium VXLAN" }
  - { port: 4240, proto: tcp, src: "{{ lan_subnet }}", comment: "Cilium health" }
  - { port: 4244, proto: tcp, src: "{{ lan_subnet }}", comment: "Hubble server" }
  - { port: 10250, proto: tcp, src: "{{ lan_subnet }}", comment: "kubelet API" }

# All traffic from the other cluster nodes and from pods (kubelet, etcd,
# Cilium VXLAN/health, NodePorts). Cilium enforces finer policy later.
firewall_trusted_sources: >-
  {{ groups['k8s'] | map('extract', hostvars, 'node_ip') | list + [k8s_pod_cidr] }}

# Pod traffic is routed through the host.
firewall_routed_policy: allow
