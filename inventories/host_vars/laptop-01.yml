---
# host_vars/laptop-01.yml
# Control plane (amd64, Debian 13). Wired Ethernet, lid closed.

# First login is as root with its password (Debian: root password set at
# install). Needs a one-off PermitRootLogin override, see docs/K8S_BOOTSTRAP.md.
bootstrap_user: root

# ── Power (roles/laptop_power) ───────────────────────────────────────────────
laptop_power_enabled: true
laptop_battery_charge_limit: 80
# Power monitor (site power alerts, clean shutdown) is on by default; this
# is the battery % it shuts down at.
laptop_shutdown_battery_percent: 15

# ── Wake-on-LAN (roles/wake_on_lan) ──────────────────────────────────────────
# No AC power-on in this ThinkPad's BIOS (tested 14 Oct): the Pis wake it.
# BIOS: Network → Wake on LAN = AC Only.
wol_mac: "{{ mac_laptop_01 | default('') }}"

# ── Network (roles/node_network, roles/tailscale) ────────────────────────────
# Wired only: a second LAN address (Wi-Fi) breaks Cilium's node-to-node trust.
node_disable_wifi: true

# Site subnet router: lets the home PC reach non-tailnet devices at the site
# (router UI, fresh nodes). Turn on with tailscale_subnet_router: true in
# overrides.yml once lan_subnet is the site's and doesn't overlap home.
tailscale_advertise_routes: "{{ [lan_subnet] if tailscale_subnet_router | default(false) | bool else [] }}"
