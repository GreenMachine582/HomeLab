---
# host_vars/rpi-02.yml
# General worker: Pi 4B Rev 1.5, 8 GB (arm64, Raspberry Pi OS trixie), boots
# from SD, in an Argon ONE V2. Identified 15 Oct with
# playbooks/identify_nodes.yml (MAC d8:3a:dd:26:ae:ec, Argon MCU at I2C 0x1a).

# Uncomment if the user created at imaging isn't "admin".
# bootstrap_user: <imager-user>

# First contact only, if the router doesn't reserve ip_rpi_02: the node's
# DHCP address (docs/K8S_BOOTSTRAP.md, "Adding a fresh node at the site").
# bootstrap_address: "{{ dhcp_rpi_02 | default('') }}"

# ── Storage (roles/nvme_storage) ──────────────────────────────────────────────
nvme_enabled: false

# ── Backup drive (roles/backup_drive, k8s_backup) ─────────────────────────────
# TOSHIBA 1 TB USB 3.0 HDD (MQ01UBD100), bus-powered, in a blue (USB 3) port.
# Its by-id link (from `ansible-playbook playbooks/backup_drive.yml --tags
# identify`) is disk_rpi_02_backup in the gitignored overrides.yml.
backup_drive_device: "{{ disk_rpi_02_backup | default('') }}"

# ── Case (roles/argon_case) ──────────────────────────────────────────────────
argon_case: v2

# ── Cilium L7 proxy (roles/k8s_node_config) ───────────────────────────────────
# The Pi 4 kernel (bcm2711_defconfig) has a 39-bit virtual address space and
# Envoy's tcmalloc needs 48-bit, so Envoy can't run here. Labelled
# homelab/l7-proxy=unsupported: no L7/FQDN/TLS-policed pods or Gateway here.
cilium_l7_proxy: false
