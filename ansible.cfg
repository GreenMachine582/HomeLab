[defaults]
roles_path          = ./roles
collections_path    = ./collections
inventory           = ./inventories/k8s.yml
stdout_callback       = default
result_format         = yaml
bin_ansible_callbacks = true
# One Discord message per run (callback_plugins/run_notify.py).
callback_plugins      = ./callback_plugins
callbacks_enabled     = run_notify
forks               = 5

[ssh_connection]
pipelining = true
# ServerAlive: a node that reboots or drops off the tailnet doesn't close
# the TCP session; without keepalives a task hangs on it indefinitely.
ssh_args   = -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4